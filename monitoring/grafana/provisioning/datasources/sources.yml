apiVersion: 1
datasources:
  - name: AI4I Prometheus
    uid: ai4i-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
  - name: AI4I PostgreSQL
    uid: ai4i-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: $GRAFANA_DB_USER
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
    editable: false
