apiVersion: 1
groups:
  - orgId: 1
    name: ai4i-drift-evaluation
    folder: AI4I MLOps
    interval: 10s
    rules:
      - uid: ai4i-dataset-drift
        title: AI4I dataset drift
        condition: C
        for: 0s
        noDataState: NoData
        execErrState: Error
        isPaused: false
        labels:
          project: ai4i
          severity: warning
        annotations:
          summary: 'Dataset drift for {{ $labels.model_name }} version {{ $labels.model_version }}'
          description: 'Latest stored Evidently result indicates drift. Review its feature methods and thresholds. A subsequent normal result recovers this alert. No automatic retraining.'
          __dashboardUid__: ai4i-monitoring
          __panelId__: "13"
        data:
          - refId: A
            datasourceUid: ai4i-postgres
            relativeTimeRange:
              from: 86400
              to: 0
            model:
              refId: A
              datasource:
                type: grafana-postgresql-datasource
                uid: ai4i-postgres
              editorMode: code
              format: time_series
              rawSql: |
                WITH latest AS (
                  SELECT DISTINCT ON (model_name, model_version)
                    model_name, model_version, metric_value, calculated_at, status
                  FROM monitoring_metrics
                  WHERE metric_name = 'dataset_drift' AND run_id IS NOT NULL
                  ORDER BY model_name, model_version, calculated_at DESC, id DESC
                )
                SELECT NOW() AS time, model_name, model_version,
                  CASE WHEN calculated_at > NOW() - INTERVAL '24 hours'
                    AND status IN ('normal', 'drift') THEN metric_value
                    ELSE NULL END AS drift
                FROM latest ORDER BY model_name, model_version
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params: [0.5]
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
                    params: []
                  query:
                    params: [C]
                  type: query
